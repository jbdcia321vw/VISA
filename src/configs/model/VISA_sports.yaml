# NOTE: item-side param EFFECTIVE domain is sports; baby a-coeffs (-.1/1.2/-.8) transfer fine here.
model: VISA
class: VISA
MODEL_TYPE: model

# ---- item side (sports-tuned) ----
alpha: 0.6
adjust_s: 0.6
a1: -0.1
a2: 1.2
a3: -0.8
beta: 0.1
gamma: 0.02
knn_k: 20
ncer: True
ncer_pow: 0.1

req_training: False
epochs: 1
eval_step: 1
stopping_step: 1

# ---- SBG (Spectral-Balanced Graph) modality freq-band reweight (v2: ON) ----
sbg_enabled: True
sbg_bands: 3
sbg_init_w: "1.0,1.0,1.0"
sbg_band_edges: "0.7,0.95,1.0"
sbg_uu: True

# ---- UU side ----
mu_user: 0.25
uu_k: 40
uu_adapt_tau: 12.0