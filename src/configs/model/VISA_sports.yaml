#     gamma:    0.02->.1184, 0.05->.1190                        <- 0.02 (with beta.1: 0.02->.1221 vs 0.05->.1164)
#     ncer_pow: 0.1->.1184, 1->.1214 (only at beta.06)          <- keep 0.1 with beta.1
#   combos: beta.1 x ncer1 collapses (.1088); ncer1 good only at beta.06 -> strong interaction,
